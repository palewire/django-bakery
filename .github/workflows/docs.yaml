name: Documentation

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: make install-docs

      - name: Build Sphinx documentation
        run: make docs-check

      - name: Prune uv cache
        run: uv cache prune --ci

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ./docs/_build/html/
          if-no-files-found: error
          retention-days: 7

  linkcheck:
    name: Check documentation links
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: make install-docs

      - name: Check documentation links
        run: make linkcheck

      - name: Prune uv cache
        run: uv cache prune --ci

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      vars.DOCS_DEPLOY_ENABLED == 'true'
    environment: docs-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: true
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: docs-site

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DOCS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DOCS_AWS_REGION }}

      - name: Upload documentation to Amazon S3
        uses: datadesk/delivery-deploy-action@v1
        with:
          bucket: ${{ secrets.DOCS_AWS_BUCKET }}
          base-path: ${{ secrets.DOCS_AWS_BASE_PATH }}
          dir: ./docs-site
          should-cache: false
          use-accelerate-endpoint: false
          public: true
