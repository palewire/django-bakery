name: Continuous deployment

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: make install-dev

      - name: Run static checks
        run: make check

      - name: Prune uv cache
        run: uv cache prune --ci

  test-python:
    name: Test Python ${{ matrix.python }} with Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          - python: "3.11"
            django: "6.0"
          - python: "3.11"
            django: "6.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install Python dependencies
        run: make install-test UV_PYTHON=${{ matrix.python }}

      - name: Install Django matrix version
        run: uv pip install --python .venv/bin/python "Django~=${{ matrix.django }}.0"

      - name: Run tests
        run: .venv/bin/python -m pytest
        env:
          AWS_ACCESS_KEY_ID: "MOCK_ACCESS_KEY_ID"
          AWS_SECRET_ACCESS_KEY: "MOCK_SECRET_ACCESS_KEY"

      - name: Verify package distribution
        if: matrix.python == '3.13' && matrix.django == '5.2'
        run: make package-verify PACKAGE=bakery UV_PYTHON=${{ matrix.python }}
        env:
          AWS_ACCESS_KEY_ID: "MOCK_ACCESS_KEY_ID"
          AWS_SECRET_ACCESS_KEY: "MOCK_SECRET_ACCESS_KEY"

      - name: Prune uv cache
        run: uv cache prune --ci

  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    needs: [check, test-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: make install-dev

      - name: Build releases
        run: make build

      - name: Prune uv cache
        run: uv cache prune --ci

      - name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ./dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: PyPI release
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags')
    environment:
      name: pypi
      url: https://pypi.org/project/django-bakery/
    permissions:
      id-token: write
    steps:
      - name: Fetch artifact
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ./dist

      - name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          verify-metadata: true
